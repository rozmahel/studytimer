<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <!-- "hliněné" 3D: rozmazaná alfa jako výšková mapa + světlo zleva shora -->
  <filter id="clay" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="h"/>
    <feSpecularLighting in="h" surfaceScale="7" specularConstant=".9" specularExponent="28" lighting-color="#ffffff" result="spec">
      <feDistantLight azimuth="235" elevation="38"/>
    </feSpecularLighting>
    <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
    <feDiffuseLighting in="h" surfaceScale="7" diffuseConstant="1" lighting-color="#ffffff" result="diff">
      <feDistantLight azimuth="235" elevation="62"/>
    </feDiffuseLighting>
    <feComposite in="SourceGraphic" in2="diff" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="lit"/>
    <feComposite in="lit" in2="SourceGraphic" operator="arithmetic" k1="0" k2=".45" k3=".62" k4="0" result="mix"/>
    <feComposite in="mix" in2="specIn" operator="arithmetic" k1="0" k2="1" k3=".5" k4="0" result="out"/>
    <feComposite in="out" in2="SourceAlpha" operator="in"/>
  </filter>
  <filter id="claySoft" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="h"/>
    <feSpecularLighting in="h" surfaceScale="6" specularConstant=".9" specularExponent="26" lighting-color="#ffffff" result="spec">
      <feDistantLight azimuth="235" elevation="38"/>
    </feSpecularLighting>
    <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
    <feDiffuseLighting in="h" surfaceScale="6" diffuseConstant="1" lighting-color="#ffffff" result="diff">
      <feDistantLight azimuth="235" elevation="62"/>
    </feDiffuseLighting>
    <feComposite in="SourceGraphic" in2="diff" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="lit"/>
    <feComposite in="lit" in2="SourceGraphic" operator="arithmetic" k1="0" k2=".45" k3=".62" k4="0" result="mix"/>
    <feComposite in="mix" in2="specIn" operator="arithmetic" k1="0" k2="1" k3=".55" k4="0" result="out"/>
    <feComposite in="out" in2="SourceAlpha" operator="in"/>
  </filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="shadowS" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="inset" x="-10%" y="-10%" width="120%" height="120%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="b"/>
    <feOffset dx="0" dy="12" result="o"/>
    <feComposite in="SourceAlpha" in2="o" operator="out" result="ring"/>
    <feFlood flood-color="#8a6a4a" flood-opacity=".45"/>
    <feComposite in2="ring" operator="in" result="sh"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="sh"/></feMerge>
  </filter>

  <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F2564B"/><stop offset=".55" stop-color="#DE3A35"/><stop offset="1" stop-color="#B9262A"/>
  </linearGradient>
  <linearGradient id="tileSide" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#A8232A"/><stop offset="1" stop-color="#7E161D"/>
  </linearGradient>
  <radialGradient id="face" cx=".38" cy=".32" r=".8">
    <stop offset="0" stop-color="#FFFDF8"/><stop offset=".6" stop-color="#F6EFE2"/><stop offset="1" stop-color="#E6DAC6"/>
  </radialGradient>
  <linearGradient id="faceSide" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#E2D5BF"/><stop offset="1" stop-color="#C7B597"/>
  </linearGradient>
  <linearGradient id="well" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#EBE1CF"/><stop offset="1" stop-color="#F8F3EA"/>
  </linearGradient>
  <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FA5C4F"/><stop offset="1" stop-color="#D02C2C"/>
  </linearGradient>
  <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7DD07A"/><stop offset="1" stop-color="#3E9A4C"/>
  </linearGradient>
</defs>
<!-- dlaždice -->
<rect x="44" y="60" width="936" height="936" rx="226" fill="url(#tileSide)"/>
<g filter="url(#clay)"><rect x="44" y="40" width="936" height="936" rx="226" fill="url(#tile)"/></g>

<g transform="translate(0 -36)">
<!-- stíny stopek -->
<ellipse cx="540" cy="660" rx="300" ry="290" fill="#6E0E14" opacity=".55" filter="url(#shadow)"/>
<rect x="430" y="184" width="184" height="80" rx="34" fill="#6E0E14" opacity=".4" filter="url(#shadowS)" transform="translate(10 14)"/>

<!-- korunka: dřík + tlačítko -->
<rect x="480" y="236" width="64" height="70" rx="10" fill="url(#faceSide)"/>
<g filter="url(#claySoft)"><rect x="482" y="232" width="60" height="64" rx="10" fill="#EDE3D2"/></g>
<rect x="424" y="184" width="176" height="74" rx="34" fill="url(#faceSide)" transform="translate(0 12)"/>
<g filter="url(#claySoft)"><rect x="424" y="178" width="176" height="74" rx="34" fill="#F1E8D8"/></g>

<!-- boční tlačítko (vpravo nahoře) -->
<g transform="rotate(45 512 580)">
  <rect x="490" y="250" width="44" height="60" rx="10" fill="url(#faceSide)"/>
  <g filter="url(#claySoft)"><rect x="470" y="234" width="84" height="44" rx="20" fill="#EDE3D2"/></g>
</g>

<!-- pouzdro: bok + čelo -->
<circle cx="512" cy="608" r="296" fill="url(#faceSide)"/>
<g filter="url(#clay)"><circle cx="512" cy="580" r="296" fill="url(#face)"/></g>
<g filter="url(#inset)"><circle cx="512" cy="580" r="246" fill="url(#well)"/></g>

<!-- rysky -->
<g opacity=".95">
<line x1="512.0" y1="384.0" x2="512.0" y2="358.0" stroke="#D64B44" stroke-width="18" stroke-linecap="round"/>
<line x1="614.0" y1="403.3" x2="622.0" y2="389.5" stroke="#CDB9A0" stroke-width="12" stroke-linecap="round"/>
<line x1="688.7" y1="478.0" x2="702.5" y2="470.0" stroke="#CDB9A0" stroke-width="12" stroke-linecap="round"/>
<line x1="708.0" y1="580.0" x2="734.0" y2="580.0" stroke="#D64B44" stroke-width="18" stroke-linecap="round"/>
<line x1="688.7" y1="682.0" x2="702.5" y2="690.0" stroke="#CDB9A0" stroke-width="12" stroke-linecap="round"/>
<line x1="614.0" y1="756.7" x2="622.0" y2="770.5" stroke="#CDB9A0" stroke-width="12" stroke-linecap="round"/>
<line x1="512.0" y1="776.0" x2="512.0" y2="802.0" stroke="#D64B44" stroke-width="18" stroke-linecap="round"/>
<line x1="410.0" y1="756.7" x2="402.0" y2="770.5" stroke="#CDB9A0" stroke-width="12" stroke-linecap="round"/>
<line x1="335.3" y1="682.0" x2="321.5" y2="690.0" stroke="#CDB9A0" stroke-width="12" stroke-linecap="round"/>
<line x1="316.0" y1="580.0" x2="290.0" y2="580.0" stroke="#D64B44" stroke-width="18" stroke-linecap="round"/>
<line x1="335.3" y1="478.0" x2="321.5" y2="470.0" stroke="#CDB9A0" stroke-width="12" stroke-linecap="round"/>
<line x1="410.0" y1="403.3" x2="402.0" y2="389.5" stroke="#CDB9A0" stroke-width="12" stroke-linecap="round"/>
</g>

<!-- ručička -->
<line x1="512" y1="580" x2="638.4" y2="473.9" stroke="#8E1A1E" stroke-width="34" stroke-linecap="round" opacity=".4" filter="url(#shadowS)" transform="translate(8 16)"/>
<g filter="url(#claySoft)"><line x1="512" y1="580" x2="638.4" y2="473.9" stroke="url(#arc)" stroke-width="34" stroke-linecap="round"/></g>

<!-- střed -->
<circle cx="518" cy="592" r="50" fill="#7a3a2a" opacity=".35" filter="url(#shadowS)"/>
<g filter="url(#claySoft)"><circle cx="512" cy="580" r="46" fill="url(#arc)"/></g>
<g filter="url(#claySoft)"><circle cx="512" cy="580" r="17" fill="#F6EFE3"/></g>
</g>
</svg>